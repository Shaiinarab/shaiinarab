<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="500" viewBox="0 0 1400 500" role="img" aria-labelledby="title desc">
<title id="title">A constellation of interests</title><desc id="desc">Four orbiting nodes represent AI, computer science, open-source systems, and music. Fine lines and colored geometric marks connect the ideas.</desc>
<defs><linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#19152b"/><stop offset="1" stop-color="#282047"/></linearGradient><linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9d88ff"/><stop offset="1" stop-color="#6d50e6"/></linearGradient><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#d8d0ff" stroke-opacity=".08"/></pattern></defs>
<rect width="1400" height="500" rx="26" fill="url(#paper)"/><rect width="1400" height="500" rx="26" fill="url(#grid)"/><circle cx="1100" cy="220" r="188" fill="none" stroke="#dbff69" stroke-opacity=".18" stroke-width="2"/><circle cx="1100" cy="220" r="132" fill="none" stroke="#a28cff" stroke-opacity=".5" stroke-width="1.5" stroke-dasharray="5 8"/><circle cx="1100" cy="220" r="76" fill="url(#violet)"/><circle cx="1100" cy="220" r="58" fill="#211b3c" stroke="#e2dafb" stroke-opacity=".4"/>
