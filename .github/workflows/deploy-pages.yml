# Deploys this repository as a GitHub Pages site.
# Site URL: https://shaiinarab.github.io/shaiinarab/
#
# Two jobs:
#   refresh-snapshot — weekly/dispatch only: regenerates FALLBACK_REPOS from the
#     live GitHub API using the PAT environment secret (environment: github-pages),
#     opens a PR if it drifted.
#   deploy — verifies with scripts/verify.mjs, then ships ONLY the site files;
#     internal docs, BMAD/Claude scaffolding and scripts stay out of the artifact.
#
# Secret location: Settings → Environments → github-pages → Secret = "PAT".
# Environment secrets are ONLY exposed to jobs that declare
# `environment: <name>` — so refresh-snapshot declares it too. Never hardcode
# or echo the token; GitHub masks it in logs automatically.
#
# First run: if the deploy job fails with "Pages not enabled",
# open Settings → Pages and set Source = "GitHub Actions", then re-run.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 2" # weekly (Tue ~06:17 UTC): refresh the offline snapshot from the API
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Keeps FALLBACK_REPOS in assets/app.js current with the live GitHub API,
  # authenticated via the "PAT" secret on the github-pages environment so we
  # never burn the 60/hr anonymous limit. Opens a PR only when the snapshot
  # actually drifts. NOTE: environment secrets require the job to declare
  # `environment:` — and the env must be listed under this workflow's
  # permitted environments (Settings → Environments → github-pages).
  refresh-snapshot:
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-latest
    environment: github-pages
    outputs:
      refreshed-sha: ${{ steps.pr.outputs.commit }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh snapshot from the GitHub API
        env:
          GITHUB_PAT: ${{ secrets.PAT }}
        run: python3 scripts/refresh-snapshot.py

      - name: Verify after refresh
        run: node scripts/verify.mjs

      - name: Open PR if snapshot changed
        id: pr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.PAT }}
          branch: chore/refresh-offline-snapshot
          delete-branch: true
          title: "chore(hub): refresh offline repo snapshot"
          body: >
            Automated weekly sync of FALLBACK_REPOS (assets/app.js) and the
            sitemap lastmod against the live GitHub API via
            scripts/refresh-snapshot.py using GITHUB_PAT. No manual edits needed —
            merge to keep the visitors' offline fallback honest.
          commit-message: "chore(hub): refresh offline repo snapshot [skip ci]"

  deploy:
    # push: deploy right away (refresh is skipped, nothing changed to ship).
    # workflow_dispatch: redeploy current main after the refresh check passes.
    # schedule: refresh + PR only — no point deploying unchanged files.
    needs: refresh-snapshot
    # push deploys must never wait on the snapshot job — it only runs on schedule/dispatch
    if: ${{ always() && (github.event_name == 'push' || (github.event_name != 'schedule' && needs.refresh-snapshot.result != 'failure')) }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # on scheduled/dispatch runs, ship the refreshed commit if one exists
          ref: ${{ needs.refresh-snapshot.outputs.refreshed-sha || github.ref }}
          persist-credentials: false

      - name: Verify before shipping
        run: node scripts/verify.mjs

      - name: Stage site files
        run: |
          mkdir -p _site/data
          cp index.html 404.html robots.txt sitemap.xml .nojekyll _site/
          cp -r assets _site/assets
          cp data/resume.public.json _site/data/
          cp -r vendor _site/vendor

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
